name: Create Jira Issue
on:
  issues:
    types:
      - opened

jobs:
  create-issue:
    runs-on: ubuntu-latest
    steps:
      # 1. Jira 로그인
      - name: Login
        uses: atlassian/gajira-login@v3
        env:
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_USER_EMAIL: ${{ secrets.JIRA_USER_EMAIL }}

      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      # 2. 이슈 폼 파싱
      - name: Issue Parser
        uses: stefanbuck/github-issue-parser@v3
        id: issue-parser
        with:
          template-path: .github/ISSUE_TEMPLATE/issue-form.yml

      # 3. Github MD → Jira 문법 변환
      - name: Convert markdown to Jira Syntax
        uses: peter-evans/jira2md@v1
        id: md2jira
        with:
          input-text: |
            ### Github Issue Link
            - ${{ github.event.issue.html_url }}

            ${{ github.event.issue.body }}
          mode: md2jira

      # 4. Jira 이슈 생성 (issuetype을 팀 설정에 맞게 변경)
      - name: Create Jira Issue
        id: create
        uses: atlassian/gajira-create@v3
        with:
          project: PRJ          # ← 본인 Jira 프로젝트 키로 변경
          issuetype: Task       # ← Task / Subtask / Story 등 상황에 맞게
          summary: '${{ github.event.issue.title }}'
          description: '${{ steps.md2jira.outputs.output-text }}'
          fields: |
            {
              "parent": {
                "key": "${{ steps.issue-parser.outputs.issueparser_parentKey }}"
              }
            }

      # 5. Ticket Number 브랜치 생성
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Create Branch
        run: |
          ISSUE_NUMBER="${{ steps.create.outputs.issue }}"
          BRANCH_SUFFIX="${{ steps.issue-parser.outputs.issueparser_branch }}"
          BRANCH_NAME="${ISSUE_NUMBER}-$(echo ${BRANCH_SUFFIX} | sed 's/ /-/g')"
          git checkout -b "${BRANCH_NAME}"
          git push origin "${BRANCH_NAME}"

      # 6. Github 이슈 제목에 Ticket Number 추가 + Jira 링크 댓글
      - name: Update Issue Title
        uses: actions-cool/issues-helper@v3
        with:
          actions: 'update-issue'
          token: ${{ secrets.GITHUB_TOKEN }}
          title: '[${{ steps.create.outputs.issue }}] ${{ github.event.issue.title }}'

      - name: Add Jira Link Comment
        uses: actions-cool/issues-helper@v3
        with:
          actions: 'create-comment'
          token: ${{ secrets.GITHUB_TOKEN }}
          issue-number: ${{ github.event.issue.number }}
          body: 'Jira 이슈 생성됨: [${{ steps.create.outputs.issue }}](${{ secrets.JIRA_BASE_URL }}/browse/${{ steps.create.outputs.issue }})'
