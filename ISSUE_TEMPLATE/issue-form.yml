name: '이슈 생성'
description: '생성된 이슈는 Jira와 자동 연동됩니다.'
labels: [feat]
title: '이슈 이름을 작성해주세요'
body:
  - type: input
    id: parentKey
    attributes:
      label: '상위 작업 Ticket Number'
      placeholder: 'PRJ-00'
    validations:
      required: true

  - type: input
    id: branch
    attributes:
      label: '브랜치명 (영어로)'
    validations:
      required: true

  - type: input
    id: description
    attributes:
      label: '이슈 설명'
    validations:
      required: true

  - type: textarea
    id: tasks
    attributes:
      label: '체크리스트'
      value: |
        - [ ] Task1
        - [ ] Task2
    validations:
      required: true
